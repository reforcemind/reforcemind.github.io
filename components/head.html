    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ReForceMind</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <script src="tailwind.config.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        }

        .bg-composite {
            background-size: cover;
            background-position: center;
        }

        .glass-card {
            background: rgba(252, 239, 212, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(0, 0, 0, 1);
        }

        .glass-panel {
            background: rgba(252, 239, 212, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        html {
            scroll-behavior: smooth;
        }

        .hairline-b { border-bottom-width: 0.5px; }
        .hairline-t { border-top-width: 0.5px; }
        .hairline-r { border-right-width: 0.5px; }
        .hairline-l { border-left-width: 0.5px; }
        
        .master-list-item {
            transition: all 300ms;
            cursor: pointer;
        }
        .master-list-item:hover {
            background-color: rgba(245, 214, 160, 0.3); /* parchment-deep with opacity */
        }
        .master-list-item.active {
            background-color: #000000;
            color: #FCEFD4;
        }
        .master-list-item.active .text-ink-black {
            color: #FCEFD4;
        }
        .master-list-item.active .text-on-surface-variant {
            color: #eee1c7;
        }
        .content-wash {
            background: radial-gradient(circle at 50% 50%, rgba(122, 26, 26, 0.03) 0%, transparent 60%),
                        radial-gradient(circle at 100% 0%, rgba(45, 75, 50, 0.03) 0%, transparent 50%);
        }

        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(0,0,0,0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 64px 64px;
        }

        /* Markdown typography extensions */
        .markdown-body h2 {
            font-family: "Newsreader", serif;
            font-size: 24px;
            font-weight: 500;
            border-bottom: 0.5px solid #000;
            padding-bottom: 12px;
            margin-top: 32px;
            margin-bottom: 16px;
        }

        @media (min-width: 768px) {
            .markdown-body h2 {
                font-size: 32px;
                margin-top: 48px;
                margin-bottom: 24px;
            }
        }

        .markdown-body h3 {
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 32px;
            margin-bottom: 16px;
            color: #4c6c50;
        }

        .markdown-body p {
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .markdown-body ul {
            list-style-type: square;
            padding-left: 24px;
            margin-bottom: 24px;
        }

        .markdown-body.resources-list ul {
            list-style: none;
            padding: 0;
            margin-bottom: 32px;
        }

        .markdown-body.resources-list li {
            padding: 16px;
            border: 0.5px solid #000;
            margin-bottom: -0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
            transition: background-color 0.2s;
        }

        .markdown-body.resources-list li:hover {
            background: rgba(245, 214, 160, 0.5);
        }

        .markdown-body.resources-list li a {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            word-break: break-all;
        }

        .markdown-body li {
            margin-bottom: 8px;
        }
    </style>
    
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Libre+Franklin:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
