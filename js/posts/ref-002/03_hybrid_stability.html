<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body, html { background: transparent !important; margin: 0; padding: 0; }
  .js-plotly-plot .plotly .bg,
  .js-plotly-plot .plotly .plotbg,
  rect.bg { fill: transparent !important; }
</style>
</head>
<body>
<div id="plot" style="width:100%;height:460px;"></div>
<script>
var xs = [8, 16, 32, 64];

var C = {
  fd:  { line: 'rgba(155,148,144,1)',  fill: 'rgba(155,148,144,0.12)' },
  adp: { line: 'rgba(44,94,138,1)',    fill: 'rgba(44,94,138,0.10)'  },
  gt:  { line: 'rgba(42,127,98,1)',    fill: 'rgba(42,127,98,0.10)'  },
  hyb: { line: 'rgba(91,74,138,1)',    fill: 'rgba(91,74,138,0.10)'  },
};

function trace(name, ys, c, w, dash) {
  return {
    name: name,
    x: xs, y: ys,
    mode: 'lines+markers',
    line: { color: c.line, width: w || 2, dash: dash || 'solid' },
    marker: { color: c.line, size: 6, line: { color: '#fff', width: 1.2 } },
    hovertemplate: 'N=%{x}  JVP=%{y}<extra>' + name + '</extra>',
  };
}

// O(N) reference: anchor at FD N=8 (227), scale linearly
var refY = xs.map(function(n){ return Math.round(227 * n / 8); });

var data = [
  // O(N) reference first (behind everything)
  {
    name: 'O(N) reference',
    x: xs, y: refY,
    mode: 'lines',
    line: { color: 'rgba(160,152,148,0.45)', width: 1.4, dash: 'dot' },
    hoverinfo: 'skip',
    showlegend: true,
  },
  trace('FD baseline',   [227, 427, 827,  1628], C.fd,  2.2),
  trace('Group Testing', [96,  125, 351,  329],  C.gt,  2.2),
  trace('Hybrid',        [74,  136, 198,  320],  C.hyb, 2.8),
  trace('Adaptive',      [81,  101, 1046, 158],  C.adp, 2.2, 'dash'),
];

var layout = {
  annotations: [
    {
      text: 'Coupling instability<br>1,046 JVP > FD 827',
      x: 32, y: 1046, xref: 'x', yref: 'y',
      ax: 54, ay: -28,
      arrowhead: 2, arrowsize: 0.85, arrowwidth: 1.2,
      arrowcolor: C.adp.line,
      font: { size: 10, color: C.adp.line, family: 'ui-sans-serif, sans-serif' },
      bgcolor: 'rgba(255,255,255,0.78)', borderpad: 3,
    },
    {
      text: 'Adaptive 10.3× at N=64',
      x: 64, y: 158, xref: 'x', yref: 'y',
      ax: -62, ay: -38,
      arrowhead: 2, arrowsize: 0.85, arrowwidth: 1.2,
      arrowcolor: C.adp.line,
      font: { size: 10, color: C.adp.line, family: 'ui-sans-serif, sans-serif' },
      bgcolor: 'rgba(255,255,255,0.78)', borderpad: 3,
    },
    {
      text: 'Hybrid 4.2×',
      x: 32, y: 198, xref: 'x', yref: 'y',
      ax: -54, ay: 22,
      arrowhead: 2, arrowsize: 0.85, arrowwidth: 1.1,
      arrowcolor: C.hyb.line,
      font: { size: 10, color: C.hyb.line, family: 'ui-sans-serif, sans-serif' },
      bgcolor: 'rgba(255,255,255,0.78)', borderpad: 3,
    },
  ],
  xaxis: {
    title: { text: 'State dimension N', font: { size: 12.5, color: '#3a3632' } },
    tickvals: xs, ticktext: xs.map(String),
    tickfont: { size: 12, family: 'ui-monospace, monospace', color: '#3a3632' },
    showgrid: false, zeroline: false,
    range: [4, 72],
  },
  yaxis: {
    title: { text: 'Total JVPs (25 outer steps, 5 seeds)', font: { size: 12.5, color: '#3a3632' } },
    type: 'log',
    gridcolor: 'rgba(200,196,192,0.45)', gridwidth: 1,
    zeroline: false,
    tickfont: { size: 11, color: '#3a3632', family: 'ui-monospace, monospace' },
    tickformat: ',.0f',
    dtick: 1,
  },
  title: {
    text: 'Solver stability — coupled chain (log scale, off-diagonal energy ≈ 0.40)',
    font: { size: 14, color: '#1a1917', family: 'ui-sans-serif, sans-serif' },
    x: 0.5, xanchor: 'center',
  },
  paper_bgcolor: 'rgba(0,0,0,0)',
  plot_bgcolor:  'rgba(0,0,0,0)',
  margin: { t: 54, r: 24, b: 52, l: 76 },
  legend: {
    x: 0.01, y: 0.97, bgcolor: 'rgba(255,255,255,0.6)',
    bordercolor: 'rgba(180,175,170,0.5)', borderwidth: 1,
    font: { size: 11.5, color: '#1a1917', family: 'ui-sans-serif, sans-serif' },
  },
  font: { family: 'ui-sans-serif, sans-serif' },
};

Plotly.newPlot('plot', data, layout, { displayModeBar: false, responsive: true });
</script>
</body>
</html>
